name: AgentRelay Python tests
on:
  push:
    branches: [feat/telegram-cwa-mvp, feat/native-agency-v1]
  pull_request:
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests (no user credentials required)
        run: python -m unittest discover -s tests -v
